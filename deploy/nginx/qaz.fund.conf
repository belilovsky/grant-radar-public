server {
    listen 80;
    listen [::]:80;
    server_name qaz.fund www.qaz.fund;

    access_log /var/log/nginx/qaz.fund.access.log;
    error_log /var/log/nginx/qaz.fund.error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://qaz.fund$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.qaz.fund;

    ssl_certificate /etc/letsencrypt/live/qaz.fund/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qaz.fund/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://qaz.fund$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name qaz.fund;

    access_log /var/log/nginx/qaz.fund.access.log;
    error_log /var/log/nginx/qaz.fund.error.log;

    ssl_certificate /etc/letsencrypt/live/qaz.fund/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qaz.fund/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    gzip_vary on;

    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:8610;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
