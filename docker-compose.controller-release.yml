# Controller-only overlay.  The controller host agent supplies only immutable
# digest references and never invokes a local build.
services:
  api:
    image: ${QAZ_FUND_IMAGE:?QAZ_FUND_IMAGE must be an immutable digest reference}
    environment:
      APP_REVISION: ${QDEV_RELEASE_SOURCE_SHA:?QDEV_RELEASE_SOURCE_SHA is required}
      APP_SOURCE_DIRTY: "false"
      APP_IMAGE_DIGEST: ${QDEV_RELEASE_ARTIFACT_DIGEST:?QDEV_RELEASE_ARTIFACT_DIGEST is required}
      APP_ARTIFACT_DIGEST: ${QDEV_RELEASE_ARTIFACT_DIGEST:?QDEV_RELEASE_ARTIFACT_DIGEST is required}
      QAZ_FUND_ZH_HANS_ENABLED: ${QAZ_FUND_ZH_HANS_ENABLED:-false}
      QMT_RELEASE_TAG: ${QMT_RELEASE_TAG:-}
      QMT_RELEASE_SOURCE_SHA: ${QMT_RELEASE_SOURCE_SHA:-}
      QMT_IMAGE_DIGEST: ${QMT_IMAGE_DIGEST:-}
      QMT_RUNTIME_RECEIPT_DIGEST: ${QMT_RUNTIME_RECEIPT_DIGEST:-}
      QMT_MIGRATION_RECEIPT_DIGEST: ${QMT_MIGRATION_RECEIPT_DIGEST:-}
      ZH_HANS_APPROVAL_DIR: /run/qdev/zh-hans-approval
    volumes:
      - ${QDEV_ZH_HANS_APPROVAL_DIR:?QDEV_ZH_HANS_APPROVAL_DIR is required}:/run/qdev/zh-hans-approval:ro
  worker:
    image: ${QAZ_FUND_IMAGE:?QAZ_FUND_IMAGE must be an immutable digest reference}
    environment:
      APP_REVISION: ${QDEV_RELEASE_SOURCE_SHA:?QDEV_RELEASE_SOURCE_SHA is required}
      APP_SOURCE_DIRTY: "false"
      APP_IMAGE_DIGEST: ${QDEV_RELEASE_ARTIFACT_DIGEST:?QDEV_RELEASE_ARTIFACT_DIGEST is required}
      APP_ARTIFACT_DIGEST: ${QDEV_RELEASE_ARTIFACT_DIGEST:?QDEV_RELEASE_ARTIFACT_DIGEST is required}
