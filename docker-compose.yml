services:
  db:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: unless-stopped
    environment:
      POSTGRES_USER: grantradar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: grantradar
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grantradar -d grantradar"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://grantradar:${POSTGRES_PASSWORD:-changeme}@db:5432/grantradar
      GRANT_RADAR_DB_URL: postgresql+psycopg://grantradar:${POSTGRES_PASSWORD:-changeme}@db:5432/grantradar
      GRANT_RADAR_TIME_ZONE: ${GRANT_RADAR_TIME_ZONE:-Asia/Almaty}
      TZ: ${GRANT_RADAR_TIME_ZONE:-Asia/Almaty}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/ready', timeout=3).read()\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://grantradar:${POSTGRES_PASSWORD:-changeme}@db:5432/grantradar
      GRANT_RADAR_DB_URL: postgresql+psycopg://grantradar:${POSTGRES_PASSWORD:-changeme}@db:5432/grantradar
      GRANT_RADAR_TIME_ZONE: ${GRANT_RADAR_TIME_ZONE:-Asia/Almaty}
      TZ: ${GRANT_RADAR_TIME_ZONE:-Asia/Almaty}
      # Migrations are owned by the API entrypoint to avoid concurrent Alembic runs.
      GRANT_RADAR_SKIP_MIGRATIONS: "1"
      GRANT_RADAR_MAX_SOURCE_CONCURRENCY: ${GRANT_RADAR_MAX_SOURCE_CONCURRENCY:-4}
      GRANT_RADAR_WORKER_HEARTBEAT_PATH: /tmp/grant-radar-worker-heartbeat
      GRANT_RADAR_WORKER_HEARTBEAT_INTERVAL_SECONDS: "15"
      QAZLAKE_QAZFUND_FEED_URL: ${QAZLAKE_QAZFUND_FEED_URL:-}
      QAZLAKE_PRODUCT_FEED_TOKEN: ${QAZLAKE_PRODUCT_FEED_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python", "-m", "scripts.sync_qazlake_opportunities", "--loop-seconds", "900"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os,time; path=os.environ.get('GRANT_RADAR_WORKER_HEARTBEAT_PATH','/tmp/grant-radar-worker-heartbeat'); age=time.time()-os.path.getmtime(path); raise SystemExit(0 if age < 120 else 1)\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

volumes:
  pgdata: {}
