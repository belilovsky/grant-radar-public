# Native QDev self-hosted execution of the belilovsky/platform-portal
# runner-contract checks (scripts/verify_ci_execution.py and
# .github/scripts/qdev-runner-policy.py, the exact steps of its
# runner-smoke.yml and qdev-runner-contract.yml workflows).
#
# GitHub Actions is blocked for every private QDev repository by the account's
# billing state (provider annotation "account is locked due to a billing
# issue", startup_failure with zero jobs since 2026-09-13), so neither
# platform-portal workflow can start at all. This public carrier repository
# executes the same steps against an exact private revision fetched with a
# read-only deploy key on the qdev-ci self-hosted profile.
#
# This is exact-SHA execution evidence, not a provider CI status for
# belilovsky/platform-portal. The QazConsent public line (DNS/ACME/edge) is a
# separate lane and is not claimed here.
#
# The native qdev-runner-contract.yml exports, at workflow level,
#   QDEV_EXECUTION_LANE: ${{ inputs.execution_lane || 'hosted' }}
#   QDEV_EXPECTED_SHA:   ${{ inputs.expected_sha || github.sha }}
# and this lane now supplies those same two values so that the native guard is
# evaluated with the native inputs instead of with an empty environment. With
# the inputs present, scripts/verify_ci_execution.py is a provider-identity
# proof: for lane=hosted it requires RUNNER_ENVIRONMENT=github-hosted, and for
# lane=recovery it requires a controller-issued runner identity plus an
# owner-authorized workflow_dispatch. A public carrier job on the QDev
# self-hosted pool can present neither, so this one check is structurally not
# reproducible here. The lane therefore asserts the reproducible share of the
# two native workflows as hard conditions in shell, runs the reproducible
# native step on its own result, and records the provider-identity check as
# `not_reproducible` (never as passed) without letting it mask the rest. A
# non-zero exit from verify_ci_execution.py fails the run whenever it is NOT
# the provider-identity limit, so a real regression cannot hide behind the
# recorded limitation.
name: Platform Portal native carrier verify

on:
  workflow_dispatch:
    inputs:
      head_sha:
        description: "Exact 40-character commit SHA in belilovsky/platform-portal"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: platform-portal-native-carrier
  cancel-in-progress: false

env:
  SOURCE_DIR: .qdev/platform-portal
  VERIFIED_SOURCE_SHA: ${{ github.event.inputs.head_sha }}
  CARRIER_NOTE: carrier-run-identity.txt
  CARRIER_GATE_LOG: carrier-platform-portal-gate.log
  SOURCE_REPOSITORY: belilovsky/platform-portal
  QDEV_EXECUTION_LANE: hosted
  QDEV_EXPECTED_SHA: ${{ github.event.inputs.head_sha }}

jobs:
  contract:
    name: Platform Portal runner contract checks
    runs-on:
      - self-hosted
      - Linux
      - X64
      - qdev-ci
      - 'qdev-job-${{ github.run_id }}-${{ github.run_attempt }}-platform-portal-contract'
    timeout-minutes: 20
    steps:
      - name: Check out the carrier repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Check out the exact private Platform Portal revision
        env:
          PLATFORM_PORTAL_DEPLOY_KEY: ${{ secrets.PLATFORM_PORTAL_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          key_file="${RUNNER_TEMP:?}/qdev-platform-portal-key"
          (umask 077; printf '%s\n' "${PLATFORM_PORTAL_DEPLOY_KEY}" > "${key_file}")
          test -s "${key_file}"
          ssh_command="ssh -i ${key_file} -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=${RUNNER_TEMP}/qdev-known-hosts"
          export GIT_SSH_COMMAND="${ssh_command}"
          mkdir -p .qdev
          git clone --quiet --no-tags git@github.com:belilovsky/platform-portal.git "${SOURCE_DIR}"
          cd "${SOURCE_DIR}"
          if ! git cat-file -e "${VERIFIED_SOURCE_SHA}^{commit}" 2>/dev/null; then
            git fetch --quiet origin "${VERIFIED_SOURCE_SHA}"
          fi
          git checkout --quiet --detach "${VERIFIED_SOURCE_SHA}"
          test "$(git rev-parse HEAD)" = "${VERIFIED_SOURCE_SHA}"
          test -z "$(git status --porcelain --untracked-files=all)"
          git fetch --quiet origin master
          ancestor=false
          if git merge-base --is-ancestor HEAD origin/master; then ancestor=true; fi
          printf 'SOURCE_ANCESTOR_OF_MAIN=%s\n' "${ancestor}" >> "${GITHUB_ENV}"
          printf 'platform_portal_source_sha=%s ancestor_of_origin_master=%s origin_master=%s\n' \
            "$(git rev-parse HEAD)" "${ancestor}" "$(git rev-parse origin/master)"

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Run the native runner-smoke and runner-contract steps
        id: gate
        working-directory: .qdev/platform-portal
        env:
          QDEV_IDENTITY_LIMIT: "actual runner environment does not match execution lane"
        run: |
          set -uo pipefail
          log="${GITHUB_WORKSPACE}/${CARRIER_GATE_LOG}"
          : > "${log}"
          status=0
          head_sha="$(git rev-parse HEAD)"
          identity_limit="${QDEV_IDENTITY_LIMIT:-actual runner environment does not match execution lane}"
          {
            printf 'native_workflows=runner-smoke.yml,qdev-runner-contract.yml\n'
            printf 'source_sha=%s\n' "${head_sha}"
            printf 'gate_started_at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "${log}"

          # Reproducible share of the two native workflows: every
          # execution-context condition that does not depend on the
          # provider-hosted runner identity. Each is asserted hard, so this
          # lane can never report a pass it did not earn.
          printf '\nreproducible_context_assertions\n' | tee -a "${log}"
          if printf '%s' "${head_sha}" | grep -Eq '^[0-9a-f]{40}$' \
             && [ "${head_sha}" = "${QDEV_EXPECTED_SHA}" ]; then
            printf 'PASS exact_requested_checkout_sha head=%s expected=%s\n' \
              "${head_sha}" "${QDEV_EXPECTED_SHA}" | tee -a "${log}"
          else
            printf 'FAIL exact_requested_checkout_sha head=%s expected=%s\n' \
              "${head_sha}" "${QDEV_EXPECTED_SHA}" | tee -a "${log}"
            status=1
          fi
          if [ "${GITHUB_ACTIONS:-}" = "true" ]; then
            printf 'PASS github_actions_context=true\n' | tee -a "${log}"
          else
            printf 'FAIL github_actions_context=%s\n' "${GITHUB_ACTIONS:-unset}" | tee -a "${log}"
            status=1
          fi
          if printf '%s' "${GITHUB_RUN_ID:-}" | grep -Eq '^[1-9][0-9]*$' \
             && printf '%s' "${GITHUB_RUN_ATTEMPT:-}" | grep -Eq '^[1-9][0-9]*$'; then
            printf 'PASS provider_run_id=%s provider_run_attempt=%s\n' \
              "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" | tee -a "${log}"
          else
            printf 'FAIL provider_run_id=%s provider_run_attempt=%s\n' \
              "${GITHUB_RUN_ID:-unset}" "${GITHUB_RUN_ATTEMPT:-unset}" | tee -a "${log}"
            status=1
          fi
          case "${QDEV_EXECUTION_LANE:-}" in
            hosted|recovery)
              printf 'PASS execution_lane=%s\n' "${QDEV_EXECUTION_LANE}" | tee -a "${log}" ;;
            *)
              printf 'FAIL execution_lane=%s\n' "${QDEV_EXECUTION_LANE:-unset}" | tee -a "${log}"
              status=1 ;;
          esac

          # Reproducible native step of qdev-runner-contract.yml, reported on
          # its own result.
          printf '\n$ python .github/scripts/qdev-runner-policy.py --root .\n' | tee -a "${log}"
          if python .github/scripts/qdev-runner-policy.py --root . 2>&1 | tee -a "${log}"; then
            printf 'PASS qdev-runner-policy.py\n' | tee -a "${log}"
          else
            printf 'FAIL qdev-runner-policy.py\n' | tee -a "${log}"
            status=1
          fi

          # Provider-identity step. Its remaining condition after the
          # assertions above is the provider-hosted (or controller-recovery)
          # runner identity, which a public carrier job cannot present. That
          # outcome is recorded as not_reproducible, never as passed; any
          # other non-zero exit stays a hard failure.
          printf '\n$ python scripts/verify_ci_execution.py\n' | tee -a "${log}"
          identity_out="$(python scripts/verify_ci_execution.py 2>&1)"
          identity_rc=$?
          printf '%s\n' "${identity_out}" | tee -a "${log}"
          if [ "${identity_rc}" -eq 0 ]; then
            printf 'PASS scripts/verify_ci_execution.py\n' | tee -a "${log}"
          elif printf '%s' "${identity_out}" | grep -Fq "${identity_limit}" \
               && [ "${RUNNER_ENVIRONMENT:-}" != "github-hosted" ]; then
            printf 'not_reproducible scripts/verify_ci_execution.py reason=provider_identity runner_environment=%s required_for_lane_%s=github-hosted exit_code=%s\n' \
              "${RUNNER_ENVIRONMENT:-unset}" "${QDEV_EXECUTION_LANE:-hosted}" "${identity_rc}" | tee -a "${log}"
          else
            printf 'FAIL scripts/verify_ci_execution.py failure_is_not_the_provider_identity_limit exit_code=%s\n' \
              "${identity_rc}" | tee -a "${log}"
            status=1
          fi

          printf 'runner_smoke_ok repo=%s sha=%s runner=%s\n' \
            "${SOURCE_REPOSITORY}" "${VERIFIED_SOURCE_SHA}" "${RUNNER_NAME}" | tee -a "${log}"
          {
            printf '\nnative_guard_context\n'
            printf 'QDEV_EXPECTED_SHA=%s\n' "${QDEV_EXPECTED_SHA}"
            printf 'QDEV_EXECUTION_LANE=%s\n' "${QDEV_EXECUTION_LANE}"
            printf 'checked_out_head=%s expected_sha_matches_head=%s\n' \
              "${head_sha}" \
              "$([ "${head_sha}" = "${QDEV_EXPECTED_SHA}" ] && printf true || printf false)"
            printf 'GITHUB_ACTIONS=%s GITHUB_RUN_ID=%s GITHUB_RUN_ATTEMPT=%s\n' \
              "${GITHUB_ACTIONS}" "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}"
            printf 'RUNNER_ENVIRONMENT=%s RUNNER_NAME=%s required_for_lane_hosted=github-hosted\n' \
              "${RUNNER_ENVIRONMENT}" "${RUNNER_NAME}"
            printf 'structural_limit=scripts/verify_ci_execution.py accepts only a github-hosted runner (lane=hosted) or a controller-issued recovery runner (lane=recovery). A public carrier job on the QDev self-hosted pool can present neither identity, so its non-pass states a property of the guard, not a defect of belilovsky/platform-portal and not a carrier bug. The reproducible conditions the guard also enforces (exact requested checkout SHA, GITHUB_ACTIONS context, provider run id and attempt, known execution lane) are asserted above as hard conditions, and .github/scripts/qdev-runner-policy.py --root . is reported on its own reproducible result, so the recorded not_reproducible outcome cannot mask a regression.\n'
          } | tee -a "${log}"
          printf '\ngate_finished_at=%s gate_status=%s\n' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${status}" | tee -a "${log}"
          exit "${status}"

      - name: Record carrier run identity (never a provider status)
        if: always()
        run: |
          set -uo pipefail
          {
            printf 'carrier_repository=%s\n' "${GITHUB_REPOSITORY}"
            printf 'carrier_head_sha=%s\n' "${GITHUB_SHA}"
            printf 'carrier_run_id=%s\n' "${GITHUB_RUN_ID}"
            printf 'carrier_run_attempt=%s\n' "${GITHUB_RUN_ATTEMPT}"
            printf 'carrier_workflow=%s\n' "${GITHUB_WORKFLOW}"
            printf 'runner_name=%s\n' "${RUNNER_NAME}"
            printf 'verified_source_repository=%s\n' "${SOURCE_REPOSITORY}"
            printf 'verified_source_sha=%s\n' "${VERIFIED_SOURCE_SHA}"
            printf 'verified_source_ancestor_of_origin_master=%s\n' "${SOURCE_ANCESTOR_OF_MAIN:-unknown}"
            printf 'executor_profile=qdev-ci\n'
            printf 'native_inputs_supplied=QDEV_EXPECTED_SHA,QDEV_EXECUTION_LANE (native defaults of qdev-runner-contract.yml)\n'
            printf 'reproducible_checks=exact_requested_checkout_sha,github_actions_context,provider_run_id_and_attempt,known_execution_lane,qdev-runner-policy.py --root .\n'
            printf 'not_reproducible_on_carrier=scripts/verify_ci_execution.py: requires provider-hosted or controller-recovery runner identity\n'
            printf 'check_gate=%s\n' '${{ steps.gate.outcome }}'
            printf 'provider_ci_status=unavailable: private-repository Actions is blocked by account billing; this is execution evidence, not a provider status\n'
            printf 'qazconsent_public_line=not_claimed: consent.qdev.run DNS/ACME/edge is a separate owner lane\n'
            printf 'deploy=withheld migration=none registry_publish=withheld\n'
          } | tee "${CARRIER_NOTE}"

      - name: Upload the carrier evidence bundle
        if: always()
        env:
          QDEV_IF_NO_FILES: warn
        run: |
          set -euo pipefail
          test -x .github/scripts/qdev-upload-artifact.sh
          bundle=()
          for f in "${CARRIER_NOTE}" "${CARRIER_GATE_LOG}"; do
            [ -f "${f}" ] && bundle+=("${f}")
          done
          .github/scripts/qdev-upload-artifact.sh platform-portal-carrier-evidence "${bundle[@]}"

      - name: Remove the deploy key from the runner
        if: always()
        run: |
          set -uo pipefail
          rm -f "${RUNNER_TEMP}/qdev-platform-portal-key"
