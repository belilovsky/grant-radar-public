          printf 'publish_reports_image=withheld\n'
          printf 'reason=deploy/publish-reports-image.sh requires GITHUB_REPOSITORY=belilovsky/ipos and a registry candidate bound to canonical main\n'
          printf 'note=this carrier run produces build and scan evidence only; no registry candidate and no release receipt\n'

      - name: Record carrier run identity (never a release receipt)
        if: always()
        run: |
          {
            printf 'carrier_repository=%s\n' "${GITHUB_REPOSITORY}"
