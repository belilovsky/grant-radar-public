            "${GITHUB_WORKSPACE}/${CARRIER_INPUTS_DIR}/qazstack-${QAZSTACK_VERSION}-py3-none-any.whl" \
            "${QAZSTACK_WHEEL_PATH}"
          deploy/verify-qazstack-wheel.sh "${QAZSTACK_WHEEL_PATH}" "${QAZSTACK_VERSION}" "${QAZSTACK_WHEEL_SHA256}"

      - name: Install the locked reports environment
        working-directory: .qdev/ipos
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements-reports.lock
          python -m pip install --no-deps "${QAZSTACK_WHEEL_PATH}" --editable .
          python -m pip check

      - name: Build and check the isolated private reports profile
        working-directory: .qdev/ipos
        run: deploy/build-reports.sh

      - name: Scan the reports image (CRITICAL/HIGH, fixed only)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
