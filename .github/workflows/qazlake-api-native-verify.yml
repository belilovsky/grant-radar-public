# Native QDev self-hosted execution of the belilovsky/qazlake-api
# python-tests.yml job (the "Python checks" workflow).
#
# GitHub Actions is blocked for every private QDev repository by the account's
# billing state (provider annotation "account is locked due to a billing
# issue", startup_failure with zero jobs since 2026-09-13), so
# belilovsky/qazlake-api/.github/workflows/python-tests.yml cannot start at
# all. This public carrier repository executes the same steps against an
# exact private revision fetched with a read-only deploy key on the same
# qdev-ci self-hosted profile the native job requests.
#
# The native job also checks out the canonical QazStack source at a pinned
# revision with a narrowly scoped read-only key; the carrier does the same
# through the pre-existing QAZSTACK_DEPLOY_KEY secret (read-only, scoped to
# belilovsky/qazstack). Private sources are never published; only logs leave
# the runner through the QDev artifact store.
#
# This is exact-SHA execution evidence, not a provider CI status for
# belilovsky/qazlake-api. The internal (government) QazLake lane closure of
# item 3 was runtime evidence on the release host; this lane adds the
# source-revision check side only. No deployment, migration or registry
# publication is performed.
name: QazLake API native carrier verify

on:
  workflow_dispatch:
    inputs:
      head_sha:
        description: "Exact 40-character commit SHA in belilovsky/qazlake-api"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: qazlake-api-native-carrier
  cancel-in-progress: false

env:
  SOURCE_DIR: .qdev/qazlake-api
  VERIFIED_SOURCE_SHA: ${{ github.event.inputs.head_sha }}
  QAZSTACK_VENDOR_REF: 64e1ba4d65c3e2b5368636fafb0cdb4645c749b6
  CARRIER_NOTE: carrier-run-identity.txt
  CARRIER_GATE_LOG: carrier-qazlake-api-gate.log
  SOURCE_REPOSITORY: belilovsky/qazlake-api

jobs:
  python_checks:
    name: QazLake API Python checks
    runs-on:
      - self-hosted
      - Linux
      - X64
      - qdev-ci
      - 'qdev-job-${{ github.run_id }}-${{ github.run_attempt }}-qazlake-api-python'
    timeout-minutes: 45
    steps:
      - name: Check out the carrier repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Check out the exact private QazLake API revision
        env:
          QAZLAKE_API_DEPLOY_KEY: ${{ secrets.QAZLAKE_API_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          key_file="${RUNNER_TEMP:?}/qdev-qazlake-api-key"
          (umask 077; printf '%s\n' "${QAZLAKE_API_DEPLOY_KEY}" > "${key_file}")
          test -s "${key_file}"
          ssh_command="ssh -i ${key_file} -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=${RUNNER_TEMP}/qdev-known-hosts"
          export GIT_SSH_COMMAND="${ssh_command}"
          mkdir -p .qdev
          git clone --quiet --no-tags git@github.com:belilovsky/qazlake-api.git "${SOURCE_DIR}"
          cd "${SOURCE_DIR}"
          if ! git cat-file -e "${VERIFIED_SOURCE_SHA}^{commit}" 2>/dev/null; then
            git fetch --quiet origin "${VERIFIED_SOURCE_SHA}"
          fi
          git checkout --quiet --detach "${VERIFIED_SOURCE_SHA}"
          test "$(git rev-parse HEAD)" = "${VERIFIED_SOURCE_SHA}"
          test -z "$(git status --porcelain --untracked-files=all)"
          git fetch --quiet origin main
          ancestor=false
          if git merge-base --is-ancestor HEAD origin/main; then ancestor=true; fi
          printf 'SOURCE_ANCESTOR_OF_MAIN=%s\n' "${ancestor}" >> "${GITHUB_ENV}"
          printf 'qazlake_api_source_sha=%s ancestor_of_origin_main=%s origin_main=%s\n' \
            "$(git rev-parse HEAD)" "${ancestor}" "$(git rev-parse origin/main)"
          printf 'qazlake_api_python_tests_yml_sha256=%s\n' \
            "$(sha256sum .github/workflows/python-tests.yml | awk '{print $1}')"

      - name: Check out the pinned canonical QazStack source
        env:
          QAZSTACK_DEPLOY_KEY: ${{ secrets.QAZSTACK_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          key_file="${RUNNER_TEMP:?}/qdev-qazstack-vendor-key"
          (umask 077; printf '%s\n' "${QAZSTACK_DEPLOY_KEY}" > "${key_file}")
          test -s "${key_file}"
          ssh_command="ssh -i ${key_file} -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=${RUNNER_TEMP}/qdev-known-hosts-2"
          export GIT_SSH_COMMAND="${ssh_command}"
          cd "${SOURCE_DIR}"
          git clone --quiet --filter=blob:none --no-checkout git@github.com:belilovsky/qazstack.git vendor/qazstack
          git -C vendor/qazstack fetch --quiet --depth 1 origin "${QAZSTACK_VENDOR_REF}"
          git -C vendor/qazstack checkout --quiet --detach FETCH_HEAD
          test "$(git -C vendor/qazstack rev-parse HEAD)" = "${QAZSTACK_VENDOR_REF}"
          printf 'qazstack_vendor_sha=%s\n' "$(git -C vendor/qazstack rev-parse HEAD)"

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Validate the QazLake CI contract
        working-directory: .qdev/qazlake-api
        run: python scripts/validate_qazlake_ci_contract.py

      - name: Install CI dependencies
        working-directory: .qdev/qazlake-api
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.lock
          python -m pip install -e './vendor/qazstack[databus]'

      - name: Dependency vulnerability scan
        id: audit
        working-directory: .qdev/qazlake-api
        run: |
          set -euo pipefail
          log="${GITHUB_WORKSPACE}/${CARRIER_GATE_LOG}"
          : > "${log}"
          python -m pip install 'pip-audit>=2.7,<3'
          python scripts/build_qazlake_audit_requirements.py \
            --output /tmp/qazlake-audit-requirements.txt 2>&1 | tee -a "${log}"
          set +e
          pip-audit -r /tmp/qazlake-audit-requirements.txt --strict --progress-spinner off --format=json --output=/tmp/qazlake-pip-audit.json
          audit_status=$?
          test -s /tmp/qazlake-pip-audit.json || echo '{"error":"pip-audit did not produce a report"}' > /tmp/qazlake-pip-audit.json
          pip-audit -r /tmp/qazlake-audit-requirements.txt --strict --progress-spinner off --format=cyclonedx-json --output=/tmp/qazlake-sbom.json
          sbom_status=$?
          test -s /tmp/qazlake-sbom.json || echo '{"bomFormat":"CycloneDX","components":[]}' > /tmp/qazlake-sbom.json
          set -e
          cp /tmp/qazlake-pip-audit.json /tmp/qazlake-sbom.json "${GITHUB_WORKSPACE}/" 2>/dev/null || true
          printf 'pip_audit_status=%s sbom_status=%s\n' "${audit_status}" "${sbom_status}" | tee -a "${log}"
          if [ "${audit_status}" -ne 0 ]; then exit "${audit_status}"; fi
          exit "${sbom_status}"

      - name: Run the remaining native check steps
        id: gate
        working-directory: .qdev/qazlake-api
        run: |
          set -uo pipefail
          log="${GITHUB_WORKSPACE}/${CARRIER_GATE_LOG}"
          status=0
          for command in \
            'python -m py_compile main.py entitymap_runtime.py scripts/entitymap_candidate_benchmark.py' \
            'python scripts/verify_data_record_conformance.py' \
            'python -m alembic upgrade head --sql > /tmp/qazlake-schema.sql' \
            'python -m mypy' \
            'python scripts/entitymap_candidate_benchmark.py' \
            'python -m pytest -q --junitxml=/tmp/qazlake-python-junit.xml' \
            'python -m ruff check .'
          do
            printf '\n$ %s\n' "${command}" | tee -a "${log}"
            if eval "${command}" 2>&1 | tee -a "${log}"; then
              printf 'PASS %s\n' "${command}" | tee -a "${log}"
            else
              printf 'FAIL %s\n' "${command}" | tee -a "${log}"
              status=1
            fi
          done
          printf '\ngate_finished_at=%s gate_status=%s\n' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${status}" | tee -a "${log}"
          exit "${status}"

      - name: Record carrier run identity (never a provider status)
        if: always()
        run: |
          set -uo pipefail
          {
            printf 'carrier_repository=%s\n' "${GITHUB_REPOSITORY}"
            printf 'carrier_head_sha=%s\n' "${GITHUB_SHA}"
            printf 'carrier_run_id=%s\n' "${GITHUB_RUN_ID}"
            printf 'carrier_run_attempt=%s\n' "${GITHUB_RUN_ATTEMPT}"
            printf 'carrier_workflow=%s\n' "${GITHUB_WORKFLOW}"
            printf 'runner_name=%s\n' "${RUNNER_NAME}"
            printf 'verified_source_repository=%s\n' "${SOURCE_REPOSITORY}"
            printf 'verified_source_sha=%s\n' "${VERIFIED_SOURCE_SHA}"
            printf 'verified_source_ancestor_of_origin_main=%s\n' "${SOURCE_ANCESTOR_OF_MAIN:-unknown}"
            printf 'verified_source_python_tests_yml_sha256=%s\n' \
              "$(sha256sum "${SOURCE_DIR}/.github/workflows/python-tests.yml" 2>/dev/null | awk '{print $1}')"
            printf 'qazstack_vendor_ref=%s\n' "${QAZSTACK_VENDOR_REF}"
            printf 'executor_profile=qdev-ci\n'
            printf 'check_audit=%s check_gate=%s\n' \
              '${{ steps.audit.outcome }}' '${{ steps.gate.outcome }}'
            printf 'provider_ci_status=unavailable: private-repository Actions is blocked by account billing; this is execution evidence, not a provider status\n'
            printf 'public_cutover_18106=not_claimed deploy=withheld migration=none registry_publish=withheld\n'
          } | tee "${CARRIER_NOTE}"

      - name: Upload the carrier evidence bundle
        if: always()
        env:
          QDEV_IF_NO_FILES: warn
        run: |
          set -euo pipefail
          test -x .github/scripts/qdev-upload-artifact.sh
          bundle=()
          for f in "${CARRIER_NOTE}" "${CARRIER_GATE_LOG}" qazlake-pip-audit.json qazlake-sbom.json; do
            [ -f "${f}" ] && bundle+=("${f}")
          done
          .github/scripts/qdev-upload-artifact.sh qazlake-api-carrier-evidence "${bundle[@]}"

      - name: Remove the deploy keys from the runner
        if: always()
        run: |
          set -uo pipefail
          rm -f "${RUNNER_TEMP}/qdev-qazlake-api-key" "${RUNNER_TEMP}/qdev-qazstack-vendor-key"
