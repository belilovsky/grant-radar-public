# Native QDev carrier execution for the private Qaz.Vision repository.
#
# GitHub Actions for the private repository is currently blocked before job
# admission by account billing.  This workflow runs the same source-bound
# gates and immutable image build on the central self-hosted QDev pool.  It is
# execution evidence for the exact private SHA, not a private-repository
# provider-CI status; deployment remains a separate, receipt-producing step.
name: Qaz.Vision native carrier verify

on:
  workflow_dispatch:
    inputs:
      head_sha:
        description: "Exact 40-character commit SHA in belilovsky/tokaev-module"
        required: true
        type: string
      mode:
        description: "Carrier lane"
        required: true
        default: quality
        type: choice
        options:
          - quality
          - image
      publish_registry:
        description: "mode=image only: publish the immutable image to the QDev registry"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: qazvision-native-carrier
  cancel-in-progress: false

env:
  QAZVISION_SOURCE_DIR: .qdev/qazvision
  VERIFIED_SOURCE_SHA: ${{ github.event.inputs.head_sha }}
  QAZVISION_SOURCE_REPOSITORY: belilovsky/tokaev-module
  QDEV_REGISTRY_URL: registry.ci.qdev.run

jobs:
  quality:
    name: Qaz.Vision Python quality gate
    if: github.event.inputs.mode == 'quality'
    runs-on:
      - self-hosted
      - Linux
      - X64
      - qdev-ci
      - 'qdev-job-${{ github.run_id }}-${{ github.run_attempt }}-qazvision-quality'
    timeout-minutes: 35
    steps:
      - name: Check out the carrier repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Check out the exact private Qaz.Vision revision
        env:
          QAZVISION_DEPLOY_KEY: ${{ secrets.QAZVISION_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          [[ "${VERIFIED_SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          key_file="${RUNNER_TEMP:?}/qdev-qazvision-deploy-key"
          (umask 077; printf '%s\n' "${QAZVISION_DEPLOY_KEY}" > "${key_file}")
          test -s "${key_file}"
          ssh_command="ssh -i ${key_file} -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=${RUNNER_TEMP}/qdev-known-hosts"
          export GIT_SSH_COMMAND="${ssh_command}"
          mkdir -p .qdev
          git clone --quiet --no-tags "git@github.com:${QAZVISION_SOURCE_REPOSITORY}.git" "${QAZVISION_SOURCE_DIR}"
          cd "${QAZVISION_SOURCE_DIR}"
          if ! git cat-file -e "${VERIFIED_SOURCE_SHA}^{commit}" 2>/dev/null; then
            git fetch --quiet origin "${VERIFIED_SOURCE_SHA}"
          fi
          git checkout --quiet --detach "${VERIFIED_SOURCE_SHA}"
          test "$(git rev-parse HEAD)" = "${VERIFIED_SOURCE_SHA}"
          test -z "$(git status --porcelain --untracked-files=all)"
          git fetch --quiet origin master
          ancestor=false
          if git merge-base --is-ancestor HEAD origin/master; then ancestor=true; fi
          printf 'SOURCE_ANCESTOR_OF_ORIGIN_MASTER=%s\n' "${ancestor}" >> "${GITHUB_ENV}"
          printf 'qazvision_source_sha=%s ancestor_of_origin_master=%s origin_master=%s\n' \
            "$(git rev-parse HEAD)" "${ancestor}" "$(git rev-parse origin/master)"

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Run the source-bound quality gates
        id: gate
        working-directory: .qdev/qazvision
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-dev.txt
          ruff check app tests scripts
          python -m compileall -q app scripts tests
          PYTHONPATH=. PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 pytest -q
          python -m pip check
          pip-audit -r requirements.txt -r requirements-dev.txt --progress-spinner off

      - name: Record the carrier quality identity
        if: always()
        run: |
          set -uo pipefail
          {
            printf 'carrier_repository=%s\n' "${GITHUB_REPOSITORY}"
            printf 'carrier_head_sha=%s\n' "${GITHUB_SHA}"
            printf 'carrier_run_id=%s\n' "${GITHUB_RUN_ID}"
            printf 'carrier_run_attempt=%s\n' "${GITHUB_RUN_ATTEMPT}"
            printf 'carrier_job=%s\n' "${GITHUB_JOB}"
            printf 'carrier_workflow=%s\n' "${GITHUB_WORKFLOW}"
            printf 'runner_name=%s\n' "${RUNNER_NAME}"
            printf 'executor_profile=qdev-ci\n'
            printf 'execution=native QDev self-hosted qdev-ci lane, real Qaz.Vision gates, carrier repository\n'
            printf 'verified_source_repository=%s\n' "${QAZVISION_SOURCE_REPOSITORY}"
            printf 'verified_source_sha=%s\n' "${VERIFIED_SOURCE_SHA}"
            printf 'verified_source_ancestor_of_origin_master=%s\n' "${SOURCE_ANCESTOR_OF_ORIGIN_MASTER:-unknown}"
            printf 'check_gate=%s\n' '${{ steps.gate.outcome }}'
            printf 'provider_ci_status=unavailable: private-repository Actions is blocked by account billing; this is execution evidence, not a provider status\n'
            printf 'release_receipt=false: deployment is a separate owner-authorized carrier continuity step\n'
            printf 'registry_publish=withheld\n'
            printf 'deploy=withheld\n'
          } | tee carrier-qazvision-quality-identity.txt

      - name: Upload carrier quality evidence
        if: always()
        env:
          QDEV_IF_NO_FILES: warn
        run: |
          set -euo pipefail
          .github/scripts/qdev-upload-artifact.sh \
            "qazvision-carrier-quality-${VERIFIED_SOURCE_SHA}" \
            carrier-qazvision-quality-identity.txt

      - name: Remove the deploy key from the runner
        if: always()
        run: |
          set -uo pipefail
          rm -f "${RUNNER_TEMP}/qdev-qazvision-deploy-key"

  image:
    name: Qaz.Vision immutable application image
    if: github.event.inputs.mode == 'image'
    runs-on:
      - self-hosted
      - Linux
      - X64
      - qdev-ci-docker
      - 'qdev-job-${{ github.run_id }}-${{ github.run_attempt }}-qazvision-image'
    timeout-minutes: 40
    env:
      PUBLISH_REGISTRY: ${{ github.event.inputs.publish_registry }}
    steps:
      - name: Check out the carrier repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Check out the exact private Qaz.Vision revision
        env:
          QAZVISION_DEPLOY_KEY: ${{ secrets.QAZVISION_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          [[ "${VERIFIED_SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          key_file="${RUNNER_TEMP:?}/qdev-qazvision-deploy-key"
          (umask 077; printf '%s\n' "${QAZVISION_DEPLOY_KEY}" > "${key_file}")
          test -s "${key_file}"
          ssh_command="ssh -i ${key_file} -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=${RUNNER_TEMP}/qdev-known-hosts"
          export GIT_SSH_COMMAND="${ssh_command}"
          mkdir -p .qdev
          git clone --quiet --no-tags "git@github.com:${QAZVISION_SOURCE_REPOSITORY}.git" "${QAZVISION_SOURCE_DIR}"
          cd "${QAZVISION_SOURCE_DIR}"
          if ! git cat-file -e "${VERIFIED_SOURCE_SHA}^{commit}" 2>/dev/null; then
            git fetch --quiet origin "${VERIFIED_SOURCE_SHA}"
          fi
          git checkout --quiet --detach "${VERIFIED_SOURCE_SHA}"
          test "$(git rev-parse HEAD)" = "${VERIFIED_SOURCE_SHA}"
          test -z "$(git status --porcelain --untracked-files=all)"
          git fetch --quiet origin master
          ancestor=false
          if git merge-base --is-ancestor HEAD origin/master; then ancestor=true; fi
          printf 'SOURCE_ANCESTOR_OF_ORIGIN_MASTER=%s\n' "${ancestor}" >> "${GITHUB_ENV}"
          printf 'qazvision_source_sha=%s ancestor_of_origin_master=%s origin_master=%s\n' \
            "$(git rev-parse HEAD)" "${ancestor}" "$(git rev-parse origin/master)"

      - name: Build the immutable application image
        id: build
        working-directory: .qdev/qazvision
        run: |
          set -euo pipefail
          docker build --pull=false \
            --build-arg "BUILD_COMMIT=${VERIFIED_SOURCE_SHA}" \
            --build-arg "BUILD_SOURCE=https://github.com/${QAZVISION_SOURCE_REPOSITORY}" \
            --tag "qazvision:${VERIFIED_SOURCE_SHA}" . 2>&1 | tee "${GITHUB_WORKSPACE}/carrier-qazvision-image.log"
          revision="$(docker image inspect "qazvision:${VERIFIED_SOURCE_SHA}" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          test "${revision}" = "${VERIFIED_SOURCE_SHA}"
          docker image inspect "qazvision:${VERIFIED_SOURCE_SHA}" > "${GITHUB_WORKSPACE}/qazvision-image-inspect.json"

      - name: Publish and pull back the immutable image
        id: publish
        if: github.event.inputs.publish_registry == 'true'
        working-directory: .qdev/qazvision
        env:
          QDEV_REGISTRY_USERNAME: ${{ secrets.QDEV_REGISTRY_USERNAME }}
          QDEV_REGISTRY_PASSWORD: ${{ secrets.QDEV_REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${QDEV_REGISTRY_USERNAME:-}" && test -n "${QDEV_REGISTRY_PASSWORD:-}"
          registry="${QDEV_REGISTRY_URL%/}"
          remote="${registry}/${QAZVISION_SOURCE_REPOSITORY}"
          local_image="qazvision:${VERIFIED_SOURCE_SHA}"
          local_image_id="$(docker image inspect --format '{{.Id}}' "${local_image}")"
          printf '%s\n' "${QDEV_REGISTRY_PASSWORD}" | docker login "${registry}" \
            --username "${QDEV_REGISTRY_USERNAME}" --password-stdin
          docker tag "${local_image}" "${remote}:${VERIFIED_SOURCE_SHA}"
          docker push "${remote}:${VERIFIED_SOURCE_SHA}" 2>&1 | tee -a "${GITHUB_WORKSPACE}/carrier-qazvision-image.log"
          repo_digest="$(docker image inspect "${remote}:${VERIFIED_SOURCE_SHA}" --format '{{range .RepoDigests}}{{println .}}{{end}}' | awk -v prefix="${remote}@" 'index($0, prefix) == 1 {print; exit}')"
          test -n "${repo_digest}"
          case "${repo_digest}" in
            "${remote}@sha256:"*) ;;
            *) echo "Registry did not return the expected immutable digest" >&2; exit 3 ;;
          esac
          digest="${repo_digest##*@}"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          pulled_image_id="$(docker pull "${remote}@${digest}" >/dev/null 2>&1; docker image inspect --format '{{.Id}}' "${remote}@${digest}")"
          test "${pulled_image_id}" = "${local_image_id}"
          revision="$(docker image inspect "${remote}@${digest}" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          test "${revision}" = "${VERIFIED_SOURCE_SHA}"
          REGISTRY_REPO_DIGEST="${repo_digest}" LOCAL_IMAGE_ID="${local_image_id}" PULLED_IMAGE_ID="${pulled_image_id}" \
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          digest_ref = os.environ["REGISTRY_REPO_DIGEST"]
          Path("release-image.json").write_text(json.dumps({
              "schema": "qazvision-carrier-image/v1",
              "repository": os.environ["QAZVISION_SOURCE_REPOSITORY"],
              "release_image": digest_ref,
              "image_digest": digest_ref.rsplit("@", 1)[1],
              "oci_revision": os.environ["VERIFIED_SOURCE_SHA"],
              "source_commit": os.environ["VERIFIED_SOURCE_SHA"],
              "carrier": {
                  "repository": os.environ["GITHUB_REPOSITORY"],
                  "head_sha": os.environ["GITHUB_SHA"],
                  "run_id": int(os.environ["GITHUB_RUN_ID"]),
                  "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
                  "job": os.environ["GITHUB_JOB"],
                  "workflow": os.environ["GITHUB_WORKFLOW"],
                  "executor_profile": "qdev-ci-docker",
              },
              "provider_ci_status": "unavailable: private-repository Actions is blocked by account billing",
              "execution_lane": "carrier",
              "pull_back_verified": True,
              "local_image_id": os.environ["LOCAL_IMAGE_ID"],
              "pull_back_image_id": os.environ["PULLED_IMAGE_ID"],
              "release_state": "owner_authorized_carrier_continuity",
          }, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          printf 'REGISTRY_REPO_DIGEST=%s\n' "${repo_digest}" >> "${GITHUB_ENV}"
          printf 'registry_repo_digest=%s\nregistry_pull_back_verified=true\n' "${repo_digest}" \
            | tee "${GITHUB_WORKSPACE}/qazvision-carrier-image-identity.txt"

      - name: Record the carrier image identity
        if: always()
        run: |
          set -uo pipefail
          {
            printf 'carrier_repository=%s\n' "${GITHUB_REPOSITORY}"
            printf 'carrier_head_sha=%s\n' "${GITHUB_SHA}"
            printf 'carrier_run_id=%s\n' "${GITHUB_RUN_ID}"
            printf 'carrier_run_attempt=%s\n' "${GITHUB_RUN_ATTEMPT}"
            printf 'carrier_job=%s\n' "${GITHUB_JOB}"
            printf 'carrier_workflow=%s\n' "${GITHUB_WORKFLOW}"
            printf 'runner_name=%s\n' "${RUNNER_NAME}"
            printf 'executor_profile=qdev-ci-docker\n'
            printf 'execution=native QDev self-hosted qdev-ci-docker lane, exact private image build/publish, carrier repository\n'
            printf 'verified_source_repository=%s\n' "${QAZVISION_SOURCE_REPOSITORY}"
            printf 'verified_source_sha=%s\n' "${VERIFIED_SOURCE_SHA}"
            printf 'verified_source_ancestor_of_origin_master=%s\n' "${SOURCE_ANCESTOR_OF_ORIGIN_MASTER:-unknown}"
            printf 'check_build=%s\n' '${{ steps.build.outcome }}'
            printf 'check_publish=%s\n' '${{ steps.publish.outcome }}'
            printf 'provider_ci_status=unavailable: private-repository Actions is blocked by account billing; this is execution evidence, not a provider status\n'
            printf 'release_receipt=false: deployment is a separate owner-authorized carrier continuity step\n'
            if [ -n "${REGISTRY_REPO_DIGEST:-}" ]; then
              printf 'registry_publish=published repo_digest=%s pull_back_verified=true\n' "${REGISTRY_REPO_DIGEST}"
            else
              printf 'registry_publish=withheld\n'
            fi
            printf 'deploy=withheld\n'
          } | tee carrier-qazvision-image-identity.txt

      - name: Upload carrier image evidence
        if: always()
        env:
          QDEV_IF_NO_FILES: warn
        run: |
          set -euo pipefail
          .github/scripts/qdev-upload-artifact.sh \
            "qazvision-carrier-image-${VERIFIED_SOURCE_SHA}" \
            .qdev/qazvision/release-image.json carrier-qazvision-image-identity.txt \
            carrier-qazvision-image-identity.txt carrier-qazvision-image.log \
            qazvision-image-inspect.json

      - name: Remove deploy key and registry credentials from the runner
        if: always()
        run: |
          set -uo pipefail
          docker logout "${QDEV_REGISTRY_URL}" >/dev/null 2>&1 || true
          rm -f "${RUNNER_TEMP}/qdev-qazvision-deploy-key"
