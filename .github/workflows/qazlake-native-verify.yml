# Native QDev self-hosted execution of the QazLake CI gate.
#
# GitHub Actions is blocked for every private QDev repository by the account's
# billing state (startup_failure, zero jobs, every private repository, since
# 2026-09-13), so belilovsky/qazlake/.github/workflows/ci.yml cannot start at
# all: both its jobs request `ubuntu-24.04` GitHub-hosted runners.
#
# This public carrier repository is admitted by the QDev runner broker and runs
# the real QazLake gate steps against an exact private revision fetched with a
# read-only deploy key on the self-hosted QDev runner profiles (qdev-ci for the
# repository gate, qdev-ci-docker for the compose gate).
#
# The private gate entry point `.github/scripts/verify_ci.py` refuses to produce
# evidence outside the belilovsky/qazlake provider context
# (`verify_ci_execution.validate_execution`), and this lane deliberately does not
# fake that context: the same commands are executed one by one, and the run
# records `provider_ci_status=unavailable` instead of claiming a provider status
# for the private repository.
#
# This is exact-SHA execution evidence, not the QazLake release lane. No
# registry publish, no deploy, no release receipt, no migration happens here.
#
# The native lane reports a finding as one silent job failure; this carrier lane
# always tees every gate log into an uploaded artifact, so every failure stays
# readable instead of invisible.
name: QazLake native carrier verify

on:
  workflow_dispatch:
    inputs:
      head_sha:
        description: "Exact 40-character commit SHA in belilovsky/qazlake"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: qazlake-native-carrier
  cancel-in-progress: false

env:
  QAZLAKE_SOURCE_DIR: .qdev/qazlake
  VERIFIED_SOURCE_SHA: ${{ github.event.inputs.head_sha }}
  DOCKER_CLI_IMAGE: docker:27-cli@sha256:851f91d241214e7c6db86513b270d58776379aacc5eb9c4a87e5b47115e3065c
  CARRIER_NOTE: carrier-run-identity.txt
  CARRIER_PROBE_LOG: carrier-probe.log
  CARRIER_REPOSITORY_LOG: carrier-qazlake-repository-gate.log
  CARRIER_COMPOSE_LOG: carrier-qazlake-compose-gate.log

jobs:
  repository:
    name: QazLake repository gate (Python 3.12)
    runs-on:
      - self-hosted
      - Linux
      - X64
      - qdev-ci
      - 'qdev-job-${{ github.run_id }}-${{ github.run_attempt }}-qazlake-repository'
    timeout-minutes: 60
    steps:
      - name: Check out the carrier repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Check out the exact private QazLake revision
        env:
          QAZLAKE_DEPLOY_KEY: ${{ secrets.QAZLAKE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          key_file="${RUNNER_TEMP:?}/qdev-qazlake-deploy-key"
          (umask 077; printf '%s\n' "${QAZLAKE_DEPLOY_KEY}" > "${key_file}")
          test -s "${key_file}"
          ssh_command="ssh -i ${key_file} -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=${RUNNER_TEMP}/qdev-known-hosts"
          printf 'GIT_SSH_COMMAND=%s\n' "${ssh_command}" >> "${GITHUB_ENV}"
          export GIT_SSH_COMMAND="${ssh_command}"
          mkdir -p .qdev
          git clone --quiet --no-tags git@github.com:belilovsky/qazlake.git "${QAZLAKE_SOURCE_DIR}"
          cd "${QAZLAKE_SOURCE_DIR}"
          if ! git cat-file -e "${VERIFIED_SOURCE_SHA}^{commit}" 2>/dev/null; then
            git fetch --quiet origin "${VERIFIED_SOURCE_SHA}"
          fi
          git checkout --quiet --detach "${VERIFIED_SOURCE_SHA}"
          test "$(git rev-parse HEAD)" = "${VERIFIED_SOURCE_SHA}"
          test -z "$(git status --porcelain --untracked-files=all)"
          git fetch --quiet origin main
          ancestor=false
          if git merge-base --is-ancestor HEAD origin/main; then ancestor=true; fi
          printf 'SOURCE_ANCESTOR_OF_MAIN=%s\n' "${ancestor}" >> "${GITHUB_ENV}"
          printf 'qazlake_source_sha=%s ancestor_of_origin_main=%s origin_main=%s\n' \
            "$(git rev-parse HEAD)" "${ancestor}" "$(git rev-parse origin/main)"

      - name: Probe the runner toolchain and lane identity
        id: toolchain
        continue-on-error: true
        run: |
          set -uo pipefail
          {
            printf 'runner=%s environment=%s repository=%s workflow=%s\n' \
              "${RUNNER_NAME}" "${RUNNER_ENVIRONMENT}" "${GITHUB_REPOSITORY}" "${GITHUB_WORKFLOW}"
            printf 'qdev_job_id=%s qdev_repository=%s qdev_head_sha=%s\n' \
              "${QDEV_JOB_ID:-unset}" "${QDEV_REPOSITORY:-unset}" "${QDEV_HEAD_SHA:-unset}"
            printf 'job_hostname=%s cpus=%s\n' "$(hostname)" "$(nproc)"
            free -m | head -2 || true
            df -h / | tail -1 || true
          } >> "${CARRIER_PROBE_LOG}" 2>&1
          for tool in python3 git ssh curl jq sha256sum tar bash; do
            if command -v "${tool}" >/dev/null 2>&1; then
              printf 'PASS tool_present=%s path=%s\n' "${tool}" "$(command -v "${tool}")" \
                | tee -a "${CARRIER_PROBE_LOG}"
            else
              printf 'note tool_absent_before_setup=%s\n' "${tool}" | tee -a "${CARRIER_PROBE_LOG}"
            fi
          done

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install the gate requirements (mirrors verify_ci.py --install)
        working-directory: .qdev/qazlake
        run: |
          set -euo pipefail
          python --version
          python -m pip install --upgrade pip
          python -m pip install -r requirements-api.txt -r .github/requirements-ci.txt

      - name: Repository contract gate
        id: verify_repository
        working-directory: .qdev/qazlake
        run: |
          set -euo pipefail
          {
            printf 'step=verify_repository\n'
            python scripts/verify_repository.py
            printf 'step=public_ui_contract\n'
            python -m pytest -q tests/test_public_ui_contract.py
            printf 'step=pytest\n'
            python -m pytest -q
          } 2>&1 | tee "${GITHUB_WORKSPACE}/${CARRIER_REPOSITORY_LOG}"

      - name: Static analysis, dependency audit, secret scan and SBOM
        id: analysis
        working-directory: .qdev/qazlake
        run: |
          set -euo pipefail
          output="${RUNNER_TEMP:?}/qazlake-ci-output"
          mkdir -p "${output}"
          {
            printf 'step=ruff\n'
            ruff check . --select E9,F63,F7,F82
            printf 'step=pip_audit_public_requirements\n'
            grep -v '^qazstack' requirements.txt > "${output}/qazlake-public-requirements.txt"
            pip-audit -r "${output}/qazlake-public-requirements.txt"
            printf 'step=pip_audit_api_requirements\n'
            pip-audit -r requirements-api.txt
            printf 'step=bandit\n'
            bandit -q -r . --severity-level high --exclude ./.git,./output \
              -f json -o "${output}/qazlake-bandit.json"
            python -c "import json,os; json.load(open(os.environ['RUNNER_TEMP'] + '/qazlake-ci-output/qazlake-bandit.json'))"
            printf 'step=detect_secrets\n'
            mapfile -d '' tracked < <(git ls-files --cached --others --exclude-standard -z)
            scan_files=()
            for path in "${tracked[@]}"; do
              if [ -n "${path}" ] && [ -f "${path}" ]; then scan_files+=("${path}"); fi
            done
            printf 'detect_secrets_files=%s\n' "${#scan_files[@]}"
            detect-secrets-hook --baseline .secrets.baseline "${scan_files[@]}"
            printf 'step=cyclonedx_sbom\n'
            cyclonedx-py requirements requirements-api.txt \
              --output-format JSON --output-file "${output}/qazlake-api-sbom.cdx.json"
            python -c "import json,os; json.load(open(os.environ['RUNNER_TEMP'] + '/qazlake-ci-output/qazlake-api-sbom.cdx.json'))"
            printf 'step=none\n'
          } 2>&1 | tee -a "${GITHUB_WORKSPACE}/${CARRIER_REPOSITORY_LOG}"

      - name: Record the repository-gate carrier run identity
        if: always()
        run: |
          set -uo pipefail
          {
            printf 'carrier_repository=%s\n' "${GITHUB_REPOSITORY}"
            printf 'carrier_head_sha=%s\n' "${GITHUB_SHA}"
            printf 'carrier_run_id=%s\n' "${GITHUB_RUN_ID}"
            printf 'carrier_run_attempt=%s\n' "${GITHUB_RUN_ATTEMPT}"
            printf 'carrier_job=%s\n' "${GITHUB_JOB}"
            printf 'carrier_workflow=%s\n' "${GITHUB_WORKFLOW}"
            printf 'runner_name=%s\n' "${RUNNER_NAME}"
            printf 'verified_source_repository=belilovsky/qazlake\n'
            printf 'verified_source_sha=%s\n' "${VERIFIED_SOURCE_SHA}"
            printf 'verified_source_ancestor_of_origin_main=%s\n' "${SOURCE_ANCESTOR_OF_MAIN:-unknown}"
            printf 'executor_profile=qdev-ci\n'
            printf 'execution=native QDev self-hosted qdev-ci lane, mirrored QazLake repository gate steps, carrier repository\n'
            printf 'provider_ci_status=unavailable: private-repository Actions is blocked by account billing; this is execution evidence, not a provider status\n'
            printf 'check_verify_repository=%s check_analysis=%s\n' \
              '${{ steps.verify_repository.outcome }}' '${{ steps.analysis.outcome }}'
            printf 'release_receipt=false\n'
            printf 'registry_publish=withheld: this carrier lane never publishes\n'
            printf 'deploy=withheld: this carrier lane never deploys\n'
          } | tee "${CARRIER_NOTE}"

      - name: Upload the carrier evidence bundle
        if: always()
        env:
          QDEV_IF_NO_FILES: warn
        run: |
          set -euo pipefail
          test -x .github/scripts/qdev-upload-artifact.sh
          .github/scripts/qdev-upload-artifact.sh \
            qazlake-carrier-evidence \
            "${CARRIER_NOTE}" "${CARRIER_PROBE_LOG}" "${CARRIER_REPOSITORY_LOG}"

      - name: Remove the deploy key from the runner
        if: always()
        run: rm -f "${RUNNER_TEMP}/qdev-qazlake-deploy-key"

  compose:
    name: QazLake compose gate
    runs-on:
      - self-hosted
      - Linux
      - X64
      - qdev-ci-docker
      - 'qdev-job-${{ github.run_id }}-${{ github.run_attempt }}-qazlake-compose'
    timeout-minutes: 20
    steps:
      - name: Check out the carrier repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Check out the exact private QazLake revision
        env:
          QAZLAKE_DEPLOY_KEY: ${{ secrets.QAZLAKE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          key_file="${RUNNER_TEMP:?}/qdev-qazlake-deploy-key"
          (umask 077; printf '%s\n' "${QAZLAKE_DEPLOY_KEY}" > "${key_file}")
          test -s "${key_file}"
          ssh_command="ssh -i ${key_file} -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=${RUNNER_TEMP}/qdev-known-hosts"
          printf 'GIT_SSH_COMMAND=%s\n' "${ssh_command}" >> "${GITHUB_ENV}"
          export GIT_SSH_COMMAND="${ssh_command}"
          mkdir -p .qdev
          git clone --quiet --no-tags git@github.com:belilovsky/qazlake.git "${QAZLAKE_SOURCE_DIR}"
          cd "${QAZLAKE_SOURCE_DIR}"
          if ! git cat-file -e "${VERIFIED_SOURCE_SHA}^{commit}" 2>/dev/null; then
            git fetch --quiet origin "${VERIFIED_SOURCE_SHA}"
          fi
          git checkout --quiet --detach "${VERIFIED_SOURCE_SHA}"
          test "$(git rev-parse HEAD)" = "${VERIFIED_SOURCE_SHA}"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Compose configuration gate
        id: compose_gate
        working-directory: .qdev/qazlake
        run: |
          set -euo pipefail
          tar -cf - docker-compose.qazlake.yml docker-compose.collectors.yml \
            | QAZLAKE_DB_PASSWORD=ci-compose-validation-only docker run --rm -i --entrypoint sh \
                -e QAZLAKE_DB_PASSWORD "${DOCKER_CLI_IMAGE}" -c \
                'set -eu; mkdir -p /work; tar -xf - -C /work; cd /work; docker compose -f docker-compose.qazlake.yml -f docker-compose.collectors.yml config' \
            > "${GITHUB_WORKSPACE}/${CARRIER_COMPOSE_LOG}" 2>&1
          printf 'compose_config_bytes=%s\n' "$(wc -c < "${GITHUB_WORKSPACE}/${CARRIER_COMPOSE_LOG}")"

      - name: Record the compose-gate carrier run identity
        if: always()
        run: |
          set -uo pipefail
          {
            printf 'carrier_repository=%s\n' "${GITHUB_REPOSITORY}"
            printf 'carrier_run_id=%s carrier_run_attempt=%s carrier_job=%s\n' \
              "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" "${GITHUB_JOB}"
            printf 'verified_source_repository=belilovsky/qazlake\n'
            printf 'verified_source_sha=%s\n' "${VERIFIED_SOURCE_SHA}"
            printf 'executor_profile=qdev-ci-docker\n'
            printf 'check_compose_gate=%s\n' '${{ steps.compose_gate.outcome }}'
            printf 'provider_ci_status=unavailable: private-repository Actions is blocked by account billing\n'
          } >> "${CARRIER_NOTE}"

      - name: Upload the compose-gate evidence
        if: always()
        env:
          QDEV_IF_NO_FILES: warn
        run: |
          set -euo pipefail
          .github/scripts/qdev-upload-artifact.sh \
            qazlake-carrier-compose-evidence "${CARRIER_NOTE}" "${CARRIER_COMPOSE_LOG}"

      - name: Remove the deploy key from the runner
        if: always()
        run: rm -f "${RUNNER_TEMP}/qdev-qazlake-deploy-key"
