# Execute the control plane's complete CI command set on the existing QDev
# self-hosted carrier when its private-repository Actions event cannot start.
# Evidence is bound to the exact private commit, but is never a native private
# Actions check, signed controller admission, or release/deployment receipt.
name: QDev control plane native carrier verify

on:
  workflow_dispatch:
    inputs:
      head_sha:
        description: "Exact 40-character commit SHA in belilovsky/qdev-runner-control-plane"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: qdev-control-plane-native-carrier
  cancel-in-progress: false

env:
  SOURCE_DIR: .qdev/qdev-runner-control-plane
  SOURCE_REPOSITORY: belilovsky/qdev-runner-control-plane
  VERIFIED_SOURCE_SHA: ${{ github.event.inputs.head_sha }}
  CARRIER_NOTE: carrier-qdev-control-plane-run-identity.txt
  CARRIER_GATE_LOG: carrier-qdev-control-plane-gate.log

jobs:
  verify:
    name: Control plane full CI command set on qdev-ci
    runs-on:
      - self-hosted
      - Linux
      - X64
      - qdev-ci
      - 'qdev-job-${{ github.run_id }}-${{ github.run_attempt }}-qdev-control-plane-verify'
    timeout-minutes: 60
    steps:
      - name: Check out the carrier repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Check out the exact private control-plane revision
        env:
          QDEV_CONTROL_PLANE_DEPLOY_KEY: ${{ secrets.QDEV_CONTROL_PLANE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          [[ "${VERIFIED_SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          key_file="${RUNNER_TEMP:?}/qdev-control-plane-source-key"
          (umask 077; printf '%s\n' "${QDEV_CONTROL_PLANE_DEPLOY_KEY}" > "${key_file}")
          test -s "${key_file}"
          export GIT_SSH_COMMAND="ssh -i ${key_file} -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=${RUNNER_TEMP}/qdev-known-hosts"
          mkdir -p .qdev
          git clone --quiet --no-tags "git@github.com:${SOURCE_REPOSITORY}.git" "${SOURCE_DIR}"
          cd "${SOURCE_DIR}"
          if ! git cat-file -e "${VERIFIED_SOURCE_SHA}^{commit}" 2>/dev/null; then
            git fetch --quiet origin "${VERIFIED_SOURCE_SHA}"
          fi
          git checkout --quiet --detach "${VERIFIED_SOURCE_SHA}"
          test "$(git rev-parse HEAD)" = "${VERIFIED_SOURCE_SHA}"
          test -z "$(git status --porcelain --untracked-files=all)"
          printf 'control_plane_source_sha=%s\n' "$(git rev-parse HEAD)"
          printf 'control_plane_ci_script_sha256=%s\n' "$(sha256sum scripts/verify_controller_ci.py | awk '{print $1}')"

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install exact-source verification dependencies
        working-directory: .qdev/qdev-runner-control-plane
        run: python -m pip install -e '.[dev]'

      - name: Run the unchanged control-plane CI command set
        id: native_gate
        working-directory: .qdev/qdev-runner-control-plane
        run: |
          set -euo pipefail
          log="${GITHUB_WORKSPACE}/${CARRIER_GATE_LOG}"
          : > "${log}"
          # The QDev self-hosted runner injects its own short-lived artifact
          # identity into every job (QDEV_ARTIFACT_URL/TOKEN, QDEV_JOB_ID,
          # QDEV_REPOSITORY, QDEV_HEAD_SHA). The unchanged native CI assumes
          # the GitHub-hosted environment where those variables are absent, so
          # each exact command runs with that carrier-injected identity
          # removed. The carrier's own evidence upload below keeps its env.
          for command in \
            'python -m ruff check .' \
            'python -m ruff format --check .' \
            'python -m mypy' \
            'python -m pytest -q' \
            'python .github/scripts/qdev-runner-policy.py --root .' \
            'python scripts/verify_runtime_install.py'; do
            printf '\n$ %s\n' "${command}" | tee -a "${log}"
            (
              unset QDEV_ARTIFACT_URL QDEV_ARTIFACT_TOKEN QDEV_JOB_ID \
                QDEV_REPOSITORY QDEV_HEAD_SHA
              eval "${command}"
            ) 2>&1 | tee -a "${log}"
          done

      - name: Record exact-source carrier identity
        if: always()
        run: |
          set -uo pipefail
          {
            printf 'carrier_repository=%s\n' "${GITHUB_REPOSITORY}"
            printf 'carrier_head_sha=%s\n' "${GITHUB_SHA}"
            printf 'carrier_run_id=%s\n' "${GITHUB_RUN_ID}"
            printf 'carrier_run_attempt=%s\n' "${GITHUB_RUN_ATTEMPT}"
            printf 'carrier_workflow=%s\n' "${GITHUB_WORKFLOW}"
            printf 'runner_name=%s\n' "${RUNNER_NAME}"
            printf 'executor_profile=qdev-ci\n'
            printf 'verified_source_repository=%s\n' "${SOURCE_REPOSITORY}"
            printf 'verified_source_sha=%s\n' "${VERIFIED_SOURCE_SHA}"
            printf 'native_gate_outcome=%s\n' '${{ steps.native_gate.outcome }}'
            printf 'checks=lint,format,typing,pytest,runner-policy,runtime-install\n'
            printf 'provider_ci_status=unavailable: this carrier run does not create a private-repository check\n'
            printf 'signed_controller_admission=false release_receipt=false deploy=withheld\n'
          } | tee "${CARRIER_NOTE}"

      - name: Upload carrier evidence
        if: always()
        env:
          QDEV_IF_NO_FILES: warn
        run: |
          set -euo pipefail
          .github/scripts/qdev-upload-artifact.sh qdev-control-plane-carrier-evidence \
            "${CARRIER_NOTE}" "${CARRIER_GATE_LOG}"

      - name: Remove the read-only source key
        if: always()
        run: rm -f "${RUNNER_TEMP}/qdev-control-plane-source-key"
