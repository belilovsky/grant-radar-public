# Native QDev self-hosted execution of the belilovsky/Crisis-Monitor main.yml
# checks.
#
# GitHub Actions is blocked for every private QDev repository by the account's
# billing state (provider annotation "account is locked due to a billing
# issue", startup_failure with zero jobs since 2026-09-13), so
# belilovsky/Crisis-Monitor/.github/workflows/main.yml cannot start at all.
# This public carrier repository is admitted by the QDev runner broker and
# executes the real main.yml steps against an exact private revision fetched
# with a read-only deploy key, on the same self-hosted runner profile
# (qdev-ci).
#
# Private sources are fetched with an explicit key file plus GIT_SSH_COMMAND,
# the transport already proven on these runners by the qazcompute, IPOS,
# qazgeo, qazlake, qazpipe, QPhoto and PSSR lanes. Private source and private
# build inputs are never published; only logs and the exact-SHA regulatory
# receipts leave the runner through the QDev artifact store.
#
# Deliberately not reproduced, each with the reason recorded in the carrier
# run-identity note:
#   - tests and e2e: both need the docker profile (qdev-ci-docker) with a
#     PostGIS service container; deferred to a dedicated docker lane instead
#     of loading the shared pool here.
#   - publish-container: pushes to registry.ci.qdev.run; a carrier run must
#     never publish private release artifacts, so the push is withheld.
#   - release-notes: tag-only and publishes a GitHub release on the private
#     repository; a carrier run cannot and must not do that.
#
# The native pipeline splits checks across dependent jobs (lint, type-check,
# security, docs, sbom). This lane runs the same steps in one job per Python
# version and records every per-check outcome in the gate log; the job fails
# at the end if any check failed. Step order, tool pins and commands are
# verbatim from main.yml.
#
# This is exact-SHA execution evidence, not a provider CI status for
# belilovsky/Crisis-Monitor.
name: Crisis-Monitor native carrier verify

on:
  workflow_dispatch:
    inputs:
      head_sha:
        description: "Exact 40-character commit SHA in belilovsky/Crisis-Monitor"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: crisis-monitor-native-carrier
  cancel-in-progress: false

env:
  SOURCE_DIR: .qdev/crisis-monitor
  VERIFIED_SOURCE_SHA: ${{ github.event.inputs.head_sha }}
  CARRIER_NOTE: carrier-run-identity.txt
  CARRIER_PROBE_LOG: carrier-crisis-monitor-probe.log
  CARRIER_GATE_LOG: carrier-crisis-monitor-gate.log
  SOURCE_REPOSITORY: belilovsky/Crisis-Monitor

jobs:
  ci:
    name: Crisis-Monitor main.yml checks (Python ${{ matrix.python-version }})
    runs-on:
      - self-hosted
      - Linux
      - X64
      - qdev-ci
      - 'qdev-job-${{ github.run_id }}-${{ github.run_attempt }}-crisis-monitor-ci'
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Check out the carrier repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Check out the exact private Crisis-Monitor revision
        env:
          CRISIS_MONITOR_SOURCE_DEPLOY_KEY: ${{ secrets.CRISIS_MONITOR_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          key_file="${RUNNER_TEMP:?}/qdev-crisis-monitor-source-key"
          (umask 077; printf '%s\n' "${CRISIS_MONITOR_SOURCE_DEPLOY_KEY}" > "${key_file}")
          test -s "${key_file}"
          ssh_command="ssh -i ${key_file} -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=${RUNNER_TEMP}/qdev-known-hosts"
          export GIT_SSH_COMMAND="${ssh_command}"
          mkdir -p .qdev
          git clone --quiet --no-tags git@github.com:belilovsky/Crisis-Monitor.git "${SOURCE_DIR}"
          cd "${SOURCE_DIR}"
          if ! git cat-file -e "${VERIFIED_SOURCE_SHA}^{commit}" 2>/dev/null; then
            git fetch --quiet origin "${VERIFIED_SOURCE_SHA}"
          fi
          git checkout --quiet --detach "${VERIFIED_SOURCE_SHA}"
          test "$(git rev-parse HEAD)" = "${VERIFIED_SOURCE_SHA}"
          test -z "$(git status --porcelain --untracked-files=all)"
          git fetch --quiet origin main
          ancestor=false
          if git merge-base --is-ancestor HEAD origin/main; then ancestor=true; fi
          printf 'SOURCE_ANCESTOR_OF_MAIN=%s\n' "${ancestor}" >> "${GITHUB_ENV}"
          printf 'crisis_monitor_source_sha=%s ancestor_of_origin_main=%s origin_main=%s\n' \
            "$(git rev-parse HEAD)" "${ancestor}" "$(git rev-parse origin/main)"
          printf 'crisis_monitor_main_yml_sha256=%s\n' \
            "$(sha256sum .github/workflows/main.yml | awk '{print $1}')"

      - name: Probe the runner toolchain and lane identity
        id: toolchain
        continue-on-error: true
        run: |
          set -uo pipefail
          {
            printf 'runner=%s environment=%s repository=%s workflow=%s\n' \
              "${RUNNER_NAME}" "${RUNNER_ENVIRONMENT}" "${GITHUB_REPOSITORY}" "${GITHUB_WORKFLOW}"
            printf 'job_hostname=%s cpus=%s python_matrix=%s\n' \
              "$(hostname)" "$(nproc)" "${{ matrix.python-version }}"
            free -m | head -2 || true
            df -h / | tail -1 || true
          } >> "${CARRIER_PROBE_LOG}" 2>&1
          for tool in python3 git ssh curl awk sha256sum tar bash pip; do
            if command -v "${tool}" >/dev/null 2>&1; then
              printf 'PASS tool_present=%s path=%s\n' "${tool}" "$(command -v "${tool}")" \
                | tee -a "${CARRIER_PROBE_LOG}"
            else
              printf 'note tool_absent_before_setup=%s\n' "${tool}" | tee -a "${CARRIER_PROBE_LOG}"
            fi
          done

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run the native regulatory-report-evidence job steps
        id: canary
        working-directory: .qdev/crisis-monitor
        run: |
          set -uo pipefail
          log="${GITHUB_WORKSPACE}/${CARRIER_GATE_LOG}"
          : > "${log}"
          {
            printf 'native_job=regulatory-report-evidence source_sha=%s python=%s\n' \
              "$(git rev-parse HEAD)" "${{ matrix.python-version }}"
            printf 'canary_started_at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf '\n$ python3 scripts/verify_regulatory_report_canary.py\n'
          } | tee -a "${log}"
          if python3 scripts/verify_regulatory_report_canary.py 2>&1 | tee -a "${log}"; then
            printf 'PASS python3 scripts/verify_regulatory_report_canary.py\n' | tee -a "${log}"
          else
            printf 'FAIL python3 scripts/verify_regulatory_report_canary.py\n' | tee -a "${log}"
            exit 1
          fi

      - name: Run the native lint job steps (ruff 0.15.21)
        id: lint
        working-directory: .qdev/crisis-monitor
        run: |
          set -uo pipefail
          log="${GITHUB_WORKSPACE}/${CARRIER_GATE_LOG}"
          status=0
          for command in \
            'python -m venv .venv-lint' \
            '.venv-lint/bin/python -m pip install ruff==0.15.21' \
            '.venv-lint/bin/ruff check .'
          do
            printf '\n$ %s\n' "${command}" | tee -a "${log}"
            if eval "${command}" 2>&1 | tee -a "${log}"; then
              printf 'PASS %s\n' "${command}" | tee -a "${log}"
            else
              printf 'FAIL %s\n' "${command}" | tee -a "${log}"
              status=1
            fi
          done
          printf '\nlint_finished_at=%s lint_status=%s\n' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${status}" | tee -a "${log}"
          exit "${status}"

      - name: Run the native commit-message gate (commitizen, py3.12 only)
        id: commit-message
        if: matrix.python-version == '3.12'
        working-directory: .qdev/crisis-monitor
        run: |
          set -uo pipefail
          log="${GITHUB_WORKSPACE}/${CARRIER_GATE_LOG}"
          status=0
          for command in \
            '.venv-lint/bin/python -m pip install commitizen' \
            'git log -1 --pretty=%B > /tmp/commit-message.txt' \
            '.venv-lint/bin/cz check --commit-msg-file /tmp/commit-message.txt'
          do
            printf '\n$ %s\n' "${command}" | tee -a "${log}"
            if eval "${command}" 2>&1 | tee -a "${log}"; then
              printf 'PASS %s\n' "${command}" | tee -a "${log}"
            else
              printf 'FAIL %s\n' "${command}" | tee -a "${log}"
              status=1
            fi
          done
          printf '\ncommit_message_status=%s\n' "${status}" | tee -a "${log}"
          exit "${status}"

      - name: Run the native type-check job steps (mypy 1.18.2)
        id: typecheck
        working-directory: .qdev/crisis-monitor
        run: |
          set -uo pipefail
          log="${GITHUB_WORKSPACE}/${CARRIER_GATE_LOG}"
          status=0
          for command in \
            'python -m venv .venv-typecheck' \
            '.venv-typecheck/bin/python -m pip install --upgrade pip' \
            '.venv-typecheck/bin/python -m pip install mypy==1.18.2 types-bleach types-Markdown types-requests' \
            'PATH="${GITHUB_WORKSPACE}/${SOURCE_DIR}/.venv-typecheck/bin:${PATH}" bash scripts/typecheck.sh'
          do
            printf '\n$ %s\n' "${command}" | tee -a "${log}"
            if eval "${command}" 2>&1 | tee -a "${log}"; then
              printf 'PASS %s\n' "${command}" | tee -a "${log}"
            else
              printf 'FAIL %s\n' "${command}" | tee -a "${log}"
              status=1
            fi
          done
          printf '\ntypecheck_finished_at=%s typecheck_status=%s\n' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${status}" | tee -a "${log}"
          exit "${status}"

      - name: Run the native security job steps (bandit, pip-audit)
        id: security
        working-directory: .qdev/crisis-monitor
        run: |
          set -uo pipefail
          log="${GITHUB_WORKSPACE}/${CARRIER_GATE_LOG}"
          status=0
          for command in \
            'python -m venv .venv-security' \
            '.venv-security/bin/python -m pip install bandit pip-audit' \
            '.venv-security/bin/bandit -r app services utils scripts -x tests -ll' \
            '.venv-security/bin/pip-audit -r requirements.txt' \
            '.venv-security/bin/pip-audit -r requirements-dev.txt'
          do
            printf '\n$ %s\n' "${command}" | tee -a "${log}"
            if eval "${command}" 2>&1 | tee -a "${log}"; then
              printf 'PASS %s\n' "${command}" | tee -a "${log}"
            else
              printf 'FAIL %s\n' "${command}" | tee -a "${log}"
              status=1
            fi
          done
          printf '\nsecurity_finished_at=%s security_status=%s\n' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${status}" | tee -a "${log}"
          exit "${status}"

      - name: Run the native gitleaks step (no-git scan of the source tree)
        id: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        with:
          args: detect --source="${{ github.workspace }}/.qdev/crisis-monitor" --no-git --no-banner --redact

      - name: Record carrier run identity (never a provider status)
        if: always()
        run: |
          set -uo pipefail
          {
            printf 'carrier_repository=%s\n' "${GITHUB_REPOSITORY}"
            printf 'carrier_head_sha=%s\n' "${GITHUB_SHA}"
            printf 'carrier_run_id=%s\n' "${GITHUB_RUN_ID}"
            printf 'carrier_run_attempt=%s\n' "${GITHUB_RUN_ATTEMPT}"
            printf 'carrier_workflow=%s\n' "${GITHUB_WORKFLOW}"
            printf 'runner_name=%s\n' "${RUNNER_NAME}"
            printf 'python_matrix=%s\n' "${{ matrix.python-version }}"
            printf 'verified_source_repository=%s\n' "${SOURCE_REPOSITORY}"
            printf 'verified_source_sha=%s\n' "${VERIFIED_SOURCE_SHA}"
            printf 'verified_source_ancestor_of_origin_main=%s\n' "${SOURCE_ANCESTOR_OF_MAIN:-unknown}"
            printf 'verified_source_main_yml_sha256=%s\n' \
              "$(sha256sum "${SOURCE_DIR}/.github/workflows/main.yml" 2>/dev/null | awk '{print $1}')"
            printf 'executor_profile=qdev-ci\n'
            printf 'reproduced_native_jobs=regulatory-report-evidence,lint,type-check,security\n'
            printf 'skipped_native_jobs=tests,e2e: docker profile with PostGIS service deferred to a dedicated docker lane; publish-container: registry push withheld by the carrier; release-notes: tag-only private release publish withheld; docs,sbom: deferred, not release-gating\n'
            printf 'check_canary=%s check_lint=%s check_commit_message=%s check_typecheck=%s check_security=%s check_gitleaks=%s\n' \
              '${{ steps.canary.outcome }}' '${{ steps.lint.outcome }}' \
              '${{ steps.commit-message.outcome }}' '${{ steps.typecheck.outcome }}' \
              '${{ steps.security.outcome }}' '${{ steps.gitleaks.outcome }}'
            printf 'provider_ci_status=unavailable: private-repository Actions is blocked by account billing; this is execution evidence, not a provider status\n'
            printf 'deploy=withheld migration=none registry_publish=withheld\n'
          } | tee "${CARRIER_NOTE}"

      - name: Upload the carrier evidence bundle
        if: always()
        env:
          QDEV_IF_NO_FILES: warn
        run: |
          set -euo pipefail
          test -x .github/scripts/qdev-upload-artifact.sh
          bundle=()
          for f in "${CARRIER_NOTE}" "${CARRIER_PROBE_LOG}" "${CARRIER_GATE_LOG}"; do
            [ -f "${f}" ] && bundle+=("${f}")
          done
          .github/scripts/qdev-upload-artifact.sh crisis-monitor-carrier-evidence "${bundle[@]}"

      - name: Remove the deploy key from the runner
        if: always()
        run: |
          set -uo pipefail
          rm -f "${RUNNER_TEMP}/qdev-crisis-monitor-source-key"
