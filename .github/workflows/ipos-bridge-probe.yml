name: IPOS bridge probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selfhosted:
    name: selfhosted docker lane probe
    runs-on: [self-hosted, Linux, X64, qdev-ci-docker, 'qdev-job-${{ github.run_id }}-${{ github.run_attempt }}-ipos-probe']
    timeout-minutes: 10
    steps:
      - name: Report runner identity and tooling
        shell: bash
        run: |
          set -euo pipefail
          printf 'runner=%s env=%s os=%s repo=%s sha=%s\n' \
            "${RUNNER_NAME}" "${RUNNER_ENVIRONMENT:-unknown}" "${ImageOS:-unknown}" \
            "${GITHUB_REPOSITORY}" "${GITHUB_SHA}"
          command -v docker && docker version --format 'docker_client={{.Client.Version}} server={{.Server.Version}}'
          command -v git && git --version
          command -v curl && curl --version | head -1
          printf 'registry_url=%s registry_user=%s registry_password_set=%s\n' \
            "${QDEV_REGISTRY_URL:-<unset>}" "${QDEV_REGISTRY_USERNAME:-<unset>}" \
            "$([ -n "${QDEV_REGISTRY_PASSWORD:-}" ] && echo yes || echo no)"
          printf 'artifact_url=%s\n' "${QDEV_ARTIFACT_URL:-<unset>}"

      - name: Probe registry authentication
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /dev/null -w '%{http_code}' -m 20 "https://${QDEV_REGISTRY_URL}/v2/")"
          printf 'registry_anonymous=%s\n' "${code}"
          code="$(curl -sS -o /dev/null -w '%{http_code}' -m 20 -u "${QDEV_REGISTRY_USERNAME}:${QDEV_REGISTRY_PASSWORD}" "https://${QDEV_REGISTRY_URL}/v2/")"
          printf 'registry_authenticated=%s\n' "${code}"

      - name: Probe GitHub source transports
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          printf '%s\n' '--- https anonymous clone of private repo ---'
          GIT_TERMINAL_PROMPT=0 git ls-remote https://github.com/belilovsky/ipos.git HEAD 2>&1 | tail -3
          printf 'https_exit=%s\n' "${PIPESTATUS[0]}"
          printf '%s\n' '--- https api anonymous ---'
          curl -sS -o /dev/null -w 'api_anon=%{http_code}\n' -m 20 https://api.github.com/repos/belilovsky/ipos
          printf '%s\n' '--- ssh tcp reachability to github.com:22 ---'
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=10 -T git@github.com 2>&1 | tail -3
          printf '%s\n' '--- ssh tcp reachability to github.com:443 ---'
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=10 -p 443 -T git@ssh.github.com 2>&1 | tail -3
          printf '%s\n' '--- api with repo token ---'
          curl -sS -o /dev/null -w 'api_token=%{http_code}\n' -m 20 -H "Authorization: Bearer ${GITHUB_TOKEN:-}" https://api.github.com/repos/belilovsky/ipos

      - name: Probe artifact store
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          curl -sS -o /dev/null -w 'artifact_get=%{http_code}\n' -m 20 "${QDEV_ARTIFACT_URL:-https://ci.qdev.run/artifacts}/health" 2>&1 | tail -2

  hosted:
    name: hosted lane probe
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report hosted runner identity
        shell: bash
        run: |
          set -euo pipefail
          printf 'hosted_ok runner=%s env=%s os=%s repo=%s sha=%s\n' \
            "${RUNNER_NAME}" "${RUNNER_ENVIRONMENT:-unknown}" "${ImageOS:-unknown}" \
            "${GITHUB_REPOSITORY}" "${GITHUB_SHA}"
          docker version --format 'docker_client={{.Client.Version}} server={{.Server.Version}}' || true
          curl -sS -o /dev/null -w 'registry_anonymous=%{http_code}\n' -m 20 https://registry.ci.qdev.run/v2/ || true
